name: Actualizar datos y modelo

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días a las 6:00 a. m. de Bogotá
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "dashboard/data/**"]

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///futbol.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar partidos nuevos
        if: github.event_name != 'push'
        run: python scripts/fetch_espn.py
      - name: Pipeline
        run: |
          python src/etl.py
          python src/model.py
          python src/simulate.py
          python src/build_dashboard_data.py
          python src/make_figure.py
          python src/load_db.py
      - name: Pruebas
        run: pytest -q
      - name: Guardar cambios
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard/data docs
          git diff --cached --quiet || git commit -m "Actualización automática de datos $(date -u +%F)"
          git push
